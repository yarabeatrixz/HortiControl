name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Domínio, back-end e front-end
        run: pnpm check
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
